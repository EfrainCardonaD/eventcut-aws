name: eventcut-platform

services:
  traefik:
    image: traefik:v3.4
    container_name: eventcut-traefik
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:8080
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:8080"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - edge

  traefik-local:
    image: traefik:v3.4
    container_name: eventcut-traefik-local-ide
    profiles:
      - local-gateway
    command:
      - --providers.file.filename=/etc/traefik/dynamic.local.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:8080
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:8080"
    volumes:
      - ./infra/traefik/dynamic.local.yml:/etc/traefik/dynamic.local.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge_local

  blocked-responder:
    image: nginx:alpine
    container_name: eventcut-blocked-responder
    volumes:
      - ./infra/blocked/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.block-internal.rule=PathPrefix(`/api/internal`)
      - traefik.http.routers.block-internal.entrypoints=web
      - traefik.http.routers.block-internal.priority=1000
      - traefik.http.routers.block-internal.service=blocked
      - traefik.http.services.blocked.loadbalancer.server.port=80

  auth-mysql:
    image: mysql:8.4
    container_name: eventcut-auth-mysql
    environment:
      MYSQL_DATABASE: ${AUTH_MYSQL_DB:-eventcut_auth_db}
      MYSQL_USER: ${AUTH_MYSQL_USER:-auth_user}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD:-auth_password}
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - auth_net_internal

  events-mysql:
    image: mysql:8.4
    container_name: eventcut-events-mysql
    environment:
      MYSQL_DATABASE: ${EVENTS_MYSQL_DB:-eventcut_events_db}
      MYSQL_USER: ${EVENTS_MYSQL_USER:-events_user}
      MYSQL_PASSWORD: ${EVENTS_MYSQL_PASSWORD:-events_password}
      MYSQL_ROOT_PASSWORD: ${EVENTS_MYSQL_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - events_mysql_data:/var/lib/mysql
    networks:
      - events_net_internal

  auth-migrate:
    image: eventcut/auth-migrate:dev
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: eventcut-auth-migrate
    env_file:
      - auth/.env
    environment:
      MYSQL_HOST: auth-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${AUTH_MYSQL_DB:-eventcut_auth_db}
      MYSQL_USER: ${AUTH_MYSQL_USER:-auth_user}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD:-auth_password}
    depends_on:
      auth-mysql:
        condition: service_healthy
    networks:
      - auth_net_internal
    working_dir: /app/auth
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    restart: "no"

  events-migrate:
    image: eventcut/events-migrate:dev
    build:
      context: .
      dockerfile: events_service/Dockerfile
    container_name: eventcut-events-migrate
    env_file:
      - events_service/.env
    environment:
      MYSQL_HOST: events-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${EVENTS_MYSQL_DB:-eventcut_events_db}
      MYSQL_USER: ${EVENTS_MYSQL_USER:-events_user}
      MYSQL_PASSWORD: ${EVENTS_MYSQL_PASSWORD:-events_password}
    depends_on:
      events-mysql:
        condition: service_healthy
    networks:
      - events_net_internal
    working_dir: /app/events_service
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    restart: "no"

  auth-service:
    image: eventcut/auth-service:dev
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: eventcut-auth-service
    env_file:
      - auth/.env
    environment:
      MYSQL_HOST: auth-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${AUTH_MYSQL_DB:-eventcut_auth_db}
      MYSQL_USER: ${AUTH_MYSQL_USER:-auth_user}
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD:-auth_password}
      APP_GATEWAY_VALIDATION_ENABLED: true
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - edge
      - auth_net_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/api/auth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/verify`) || PathPrefix(`/api/password-recovery`) || Path(`/api/health`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.priority=100
      - traefik.http.services.auth.loadbalancer.server.port=8000

  events-service:
    image: eventcut/events-service:dev
    build:
      context: .
      dockerfile: events_service/Dockerfile
    container_name: eventcut-events-service
    env_file:
      - events_service/.env
    environment:
      MYSQL_HOST: events-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${EVENTS_MYSQL_DB:-eventcut_events_db}
      MYSQL_USER: ${EVENTS_MYSQL_USER:-events_user}
      MYSQL_PASSWORD: ${EVENTS_MYSQL_PASSWORD:-events_password}
      AUTH_SERVICE_BASE_URL: http://auth-service:8000
      APP_GATEWAY_SECRET: ${APP_GATEWAY_SECRET:-change-me}
      AUTH_REMOTE_VALIDATION_ENABLED: true
    depends_on:
      events-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    expose:
      - "8001"
    networks:
      - edge
      - events_net_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.events.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.events.entrypoints=web
      - traefik.http.routers.events.priority=90
      - traefik.http.services.events.loadbalancer.server.port=8001
      - traefik.http.routers.events-health.rule=Path(`/api/events/health`)
      - traefik.http.routers.events-health.entrypoints=web
      - traefik.http.routers.events-health.middlewares=events-health-rewrite
      - traefik.http.routers.events-health.service=events
      - traefik.http.middlewares.events-health-rewrite.replacepath.path=/api/health

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: eventcut-ngrok
    depends_on:
      - traefik
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    volumes:
      - ./infra/ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro
    networks:
      - edge

networks:
  edge:
    name: eventcut_edge
  edge_local:
    name: eventcut_edge_local
  auth_net_internal:
    name: eventcut_auth_net_internal
    internal: true
  events_net_internal:
    name: eventcut_events_net_internal
    internal: true

volumes:
  auth_mysql_data:
  events_mysql_data:

