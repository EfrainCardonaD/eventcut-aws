<svg width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!--
    EventCut Landing Background – Light Theme
    Extracted from LandingBackground.vue with hardcoded sRGB hex colors.
    Colors derived from oklch() design tokens (style.css).
  -->
  <defs>
    <!-- gradPath1: Tertiary (Coral/Pink) → Primary (Indigo) -->
    <linearGradient id="gradPath1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff5c75" /><!-- tertiary-400 -->
      <stop offset="50%"  stop-color="#ec0050" /><!-- tertiary-500 -->
      <stop offset="100%" stop-color="#4c4be9" /><!-- primary-600 -->
    </linearGradient>

    <!-- gradPath2: Secondary (Teal) → Tertiary → Primary -->
    <linearGradient id="gradPath2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00b8b9" /><!-- secondary-400 -->
      <stop offset="50%"  stop-color="#ff5c75" /><!-- tertiary-400 -->
      <stop offset="100%" stop-color="#5e64ff" /><!-- primary-500 -->
    </linearGradient>

    <!-- gradPath3: Primary → Tertiary → Secondary -->
    <linearGradient id="gradPath3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5e64ff" /><!-- primary-500 -->
      <stop offset="50%"  stop-color="#ec0050" /><!-- tertiary-500 -->
      <stop offset="100%" stop-color="#00b8b9" /><!-- secondary-400 -->
    </linearGradient>

    <!-- Flare radial gradient (surface center → tertiary → primary fade) -->
    <radialGradient id="flareGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.8" /><!-- surface -->
      <stop offset="20%"  stop-color="#ff96a1" stop-opacity="0.4" /><!-- tertiary-300 -->
      <stop offset="50%"  stop-color="#8090ff" stop-opacity="0.1" /><!-- primary-400 -->
      <stop offset="100%" stop-color="#5e64ff" stop-opacity="0"   /><!-- primary-500 -->
    </radialGradient>

    <!-- Particle radial gradient -->
    <radialGradient id="particleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9" /><!-- surface -->
      <stop offset="40%"  stop-color="#00b8b9" stop-opacity="0.5" /><!-- secondary-400 -->
      <stop offset="100%" stop-color="#5e64ff" stop-opacity="0"   /><!-- primary-500 -->
    </radialGradient>

    <!-- Blur filters -->
    <filter id="blurLg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blurMd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated wave paths -->
    <path id="pathAnim1" fill="none">
      <animate attributeName="d" repeatCount="indefinite" dur="20s"
        keyTimes="0; 0.33; 0.66; 1"
        values="M 2600,200 C 1900,200 1500,1000 1000,540 S 100,-200 -600,800;
                M 2600,900 C 1900,900 1500,-100 1000,540 S 100,1200 -600,300;
                M 2600,540 C 2000,-400 1000,1500 500,540 S 0,-400 -600,540;
                M 2600,200 C 1900,200 1500,1000 1000,540 S 100,-200 -600,800" />
    </path>

    <path id="pathAnim2" fill="none">
      <animate attributeName="d" repeatCount="indefinite" dur="25s"
        keyTimes="0; 0.33; 0.66; 1"
        values="M 2600,800 C 2000,800 1400,-200 900,540 S 200,1200 -600,200;
                M 2600,300 C 1800,-100 1600,1200 1000,700 S 200,-100 -600,600;
                M 2600,1000 C 2200,1400 1200,0 800,540 S -200,1200 -600,400;
                M 2600,800 C 2000,800 1400,-200 900,540 S 200,1200 -600,200" />
    </path>

    <path id="pathAnim3" fill="none">
      <animate attributeName="d" repeatCount="indefinite" dur="22s"
        keyTimes="0; 0.33; 0.66; 1"
        values="M 2600,540 C 2200,-200 1200,1300 800,540 S -100,-100 -600,900;
                M 2600,200 C 2100,600 1400,-200 1000,540 S 300,1400 -600,100;
                M 2600,900 C 1800,1200 1500,200 900,540 S 100,-200 -600,800;
                M 2600,540 C 2200,-200 1200,1300 800,540 S -100,-100 -600,900" />
    </path>
  </defs>

  <!-- Light theme background -->
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Main group – light theme opacity: 0.4 -->
  <g opacity="0.4">

    <!-- Ambient glow blobs -->
    <circle cx="1500" cy="300" r="500" fill="#8090ff" opacity="0.3" filter="url(#blurLg)">
      <!-- primary-400 -->
      <animate attributeName="opacity" values="0.1; 0.3; 0.1" dur="10s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; -80,60; 0,0" dur="18s" repeatCount="indefinite" />
    </circle>

    <circle cx="300" cy="800" r="600" fill="#44d6d6" opacity="0.2" filter="url(#blurLg)">
      <!-- secondary-300 -->
      <animate attributeName="opacity" values="0.05; 0.2; 0.05" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 80,-60; 0,0" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Wave patterns -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,-15; 0,0" dur="10s" repeatCount="indefinite" />

      <use href="#pathAnim1" stroke="url(#gradPath1)" stroke-width="90" filter="url(#blurLg)" stroke-linecap="round" opacity="0.4" />
      <use href="#pathAnim2" stroke="url(#gradPath2)" stroke-width="45" filter="url(#blurMd)" stroke-linecap="round" opacity="0.5" />
      <use href="#pathAnim3" stroke="url(#gradPath3)" stroke-width="25" filter="url(#blurMd)" stroke-linecap="round" opacity="0.6" />

      <!-- Fine solid details (surface = white) -->
      <use href="#pathAnim1" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
      <use href="#pathAnim2" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

      <!-- Dashed progress animation -->
      <use href="#pathAnim1" stroke="#a7b7ff" stroke-width="2.5" stroke-dasharray="150, 400" stroke-linecap="round" filter="url(#blurMd)" opacity="0.6">
        <!-- primary-300 -->
        <animate attributeName="stroke-dashoffset" values="1100; 0" dur="18s" repeatCount="indefinite" />
      </use>
      <use href="#pathAnim3" stroke="#ff96a1" stroke-width="2" stroke-dasharray="250, 600" stroke-linecap="round" opacity="0.6">
        <!-- tertiary-300 -->
        <animate attributeName="stroke-dashoffset" values="0; -1700" dur="22s" repeatCount="indefinite" />
      </use>
    </g>

    <!-- Particles and Flares -->
    <g>
      <animate attributeName="opacity" values="0.4; 0.7; 0.2; 0.4" dur="15s" repeatCount="indefinite" />

      <circle cx="650" cy="850" r="140" fill="url(#flareGrad)">
        <animate attributeName="r" values="130; 160; 130" dur="7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3; 0.5; 0.3" dur="9s" repeatCount="indefinite" />
      </circle>

      <circle cx="650" cy="850" r="45" fill="#ffffff" filter="url(#blurMd)" opacity="0.6">
        <!-- surface -->
        <animate attributeName="r" values="30; 50; 30" dur="5s" repeatCount="indefinite" />
      </circle>

      <!-- Floating particles -->
      <g fill="url(#particleGrad)">
        <circle cx="680" cy="800" r="6">
          <animateTransform attributeName="transform" type="translate" values="0,0; -15,-25; 0,0" dur="6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.2; 0.7; 0.2" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="600" cy="900" r="8">
          <animateTransform attributeName="transform" type="translate" values="0,0; 20,15; 0,0" dur="8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="5s" repeatCount="indefinite" />
        </circle>
        <circle cx="550" cy="830" r="4">
          <animateTransform attributeName="transform" type="translate" values="0,0; -25,10; 0,0" dur="7s" repeatCount="indefinite" />
        </circle>
        <circle cx="780" cy="880" r="5">
          <animateTransform attributeName="transform" type="translate" values="0,0; 15,-20; 0,0" dur="9s" repeatCount="indefinite" />
        </circle>
        <circle cx="720" cy="950" r="7">
          <animateTransform attributeName="transform" type="translate" values="0,0; -10,25; 0,0" dur="6.5s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.1; 0.5; 0.1" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="850" cy="780" r="4">
          <animateTransform attributeName="transform" type="translate" values="0,0; -20,-15; 0,0" dur="7s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>
</svg>
